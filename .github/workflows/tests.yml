name: Portfolio checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  lightweight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dashboard.txt pytest==8.3.4 ruff==0.11.13
      - run: python -m ruff check dashboard app.py tests/ci --select E9,F63,F7,F82
      - run: python -m pytest tests/ci -q --confcutdir=tests/ci
