<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">PharmaLens architecture</title><desc id="desc">Immutable public data through quality, SQL, statistics, frozen forecasts, decisions and dashboard, with cross-cutting validation.</desc><rect width="1200" height="650" fill="#F6F8FB"/><text x="50" y="55" font-family="Arial" font-size="30" fill="#142B45">PharmaLens · evidence from source to screen</text><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#36516D"/></marker></defs><rect x="40" y="115" width="210" height="140" rx="12" fill="white" stroke="#D8E1EB"/><rect x="40" y="115" width="210" height="8" rx="4" fill="#176B87"/><text x="55" y="153" font-family="Arial" font-size="13" fill="#176B87">01 · Source</text><text x="55" y="183" font-family="Arial" font-size="17" fill="#142B45">NHSBSA monthly PCA</text><rect x="275" y="115" width="210" height="140" rx="12" fill="white" stroke="#D8E1EB"/><rect x="275" y="115" width="210" height="8" rx="4" fill="#286E57"/><text x="290" y="153" font-family="Arial" font-size="13" fill="#286E57">02 · Processing</text><text x="290" y="183" font-family="Arial" font-size="17" fill="#142B45">Immutable API</text><text x="290" y="207" font-family="Arial" font-size="17" fill="#142B45">snapshots</text><rect x="510" y="115" width="210" height="140" rx="12" fill="white" stroke="#D8E1EB"/><rect x="510" y="115" width="210" height="8" rx="4" fill="#286E57"/><text x="525" y="153" font-family="Arial" font-size="13" fill="#286E57">03 · Processing</text><text x="525" y="183" font-family="Arial" font-size="17" fill="#142B45">Quality and provenance</text><text x="525" y="207" font-family="Arial" font-size="17" fill="#142B45">checks</text><rect x="745" y="115" width="210" height="140" rx="12" fill="white" stroke="#D8E1EB"/><rect x="745" y="115" width="210" height="8" rx="4" fill="#286E57"/><text x="760" y="153" font-family="Arial" font-size="13" fill="#286E57">04 · Processing</text><text x="760" y="183" font-family="Arial" font-size="17" fill="#142B45">Monthly analytical</text><text x="760" y="207" font-family="Arial" font-size="17" fill="#142B45">data</text><rect x="980" y="115" width="210" height="140" rx="12" fill="white" stroke="#D8E1EB"/><rect x="980" y="115" width="210" height="8" rx="4" fill="#4A578F"/><text x="995" y="153" font-family="Arial" font-size="13" fill="#4A578F">05 · Analytical</text><text x="995" y="183" font-family="Arial" font-size="17" fill="#142B45">DuckDB fact and SQL</text><text x="995" y="207" font-family="Arial" font-size="17" fill="#142B45">views</text><rect x="980" y="335" width="210" height="140" rx="12" fill="white" stroke="#D8E1EB"/><rect x="980" y="335" width="210" height="8" rx="4" fill="#4A578F"/><text x="995" y="373" font-family="Arial" font-size="13" fill="#4A578F">06 · Analytical</text><text x="995" y="403" font-family="Arial" font-size="17" fill="#142B45">Statistical</text><text x="995" y="427" font-family="Arial" font-size="17" fill="#142B45">diagnostics</text><rect x="745" y="335" width="210" height="140" rx="12" fill="white" stroke="#D8E1EB"/><rect x="745" y="335" width="210" height="8" rx="4" fill="#925C22"/><text x="760" y="373" font-family="Arial" font-size="13" fill="#925C22">07 · Forecasting</text><text x="760" y="403" font-family="Arial" font-size="17" fill="#142B45">Frozen rolling-origin</text><text x="760" y="427" font-family="Arial" font-size="17" fill="#142B45">forecasts</text><rect x="510" y="335" width="210" height="140" rx="12" fill="white" stroke="#D8E1EB"/><rect x="510" y="335" width="210" height="8" rx="4" fill="#914966"/><text x="525" y="373" font-family="Arial" font-size="13" fill="#914966">08 · Decision</text><text x="525" y="403" font-family="Arial" font-size="17" fill="#142B45">Monitoring and</text><text x="525" y="427" font-family="Arial" font-size="17" fill="#142B45">scenarios</text><rect x="275" y="335" width="210" height="140" rx="12" fill="white" stroke="#D8E1EB"/><rect x="275" y="335" width="210" height="8" rx="4" fill="#914966"/><text x="290" y="373" font-family="Arial" font-size="13" fill="#914966">09 · Decision</text><text x="290" y="403" font-family="Arial" font-size="17" fill="#142B45">Validated reporting</text><text x="290" y="427" font-family="Arial" font-size="17" fill="#142B45">marts</text><rect x="40" y="335" width="210" height="140" rx="12" fill="white" stroke="#D8E1EB"/><rect x="40" y="335" width="210" height="8" rx="4" fill="#176B87"/><text x="55" y="373" font-family="Arial" font-size="13" fill="#176B87">10 · Presentation</text><text x="55" y="403" font-family="Arial" font-size="17" fill="#142B45">Streamlit and Plotly</text><line x1="250" y1="205" x2="275" y2="205" stroke="#36516D" stroke-width="2" marker-end="url(#arrow)"/><line x1="485" y1="205" x2="510" y2="205" stroke="#36516D" stroke-width="2" marker-end="url(#arrow)"/><line x1="720" y1="205" x2="745" y2="205" stroke="#36516D" stroke-width="2" marker-end="url(#arrow)"/><line x1="955" y1="205" x2="980" y2="205" stroke="#36516D" stroke-width="2" marker-end="url(#arrow)"/><line x1="1085" y1="255" x2="1085" y2="335" stroke="#36516D" stroke-width="2" marker-end="url(#arrow)"/><line x1="980" y1="425" x2="955" y2="425" stroke="#36516D" stroke-width="2" marker-end="url(#arrow)"/><line x1="745" y1="425" x2="720" y2="425" stroke="#36516D" stroke-width="2" marker-end="url(#arrow)"/><line x1="510" y1="425" x2="485" y2="425" stroke="#36516D" stroke-width="2" marker-end="url(#arrow)"/><line x1="275" y1="425" x2="250" y2="425" stroke="#36516D" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="545" width="1150" height="65" rx="10" fill="#142B45"/><text x="60" y="584" font-family="Arial" font-size="20" fill="white">Validation across layers: source hashes · contracts · independent checks · tests · browser QA</text></svg>
